services:
  music:
    container_name: music
    image: registry.home:80/music
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_PATH=/data/db/music.db
      - MUSIC_PATH=/data/files
    ports:
      - 8000:8000
    volumes:
      - .:/app
      - ./mp3:/data/files
